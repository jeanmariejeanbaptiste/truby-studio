<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truby Studio</title>
<meta name="description" content="Atelier d'écriture scénaristique guidé par la méthode de John Truby (L'Anatomie du scénario).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=IM+Fell+English:ital@0;1&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261007080405">
<link rel="stylesheet" href="paper.css?v=20261007080405">
</head>
<body>
<script>try { if (localStorage.getItem('trubyStudio.theme') === 'nuit') document.documentElement.setAttribute('data-ambiance', 'nuit'); } catch (e) {}</script>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><filter id="ink" x="-2%" y="-10%" width="104%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="4" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="1.3" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div id="app">
  <header class="titlebar" role="banner">
    <div class="tb-left">
      <button class="tb-btn" id="btnHome" title="Mes projets"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
      <button class="tb-btn" id="btnSave" title="Enregistrer le fichier projet (Ctrl+S)"><svg viewBox="0 0 24 24"><path d="M5 3h11l4 4v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg></button>
      <button class="tb-btn" id="btnUndo" title="Annuler (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="tb-btn" id="btnRedo" title="Rétablir (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <span class="save-state" id="saveState">Enregistré</span>
    </div>
    <div class="tb-center"><span class="brand">Truby Studio</span><span class="tb-sep">·</span><span id="tbTitle" class="tb-title">Mes projets</span></div>
    <div class="tb-right">
      <button class="tb-btn hand" id="btnTheme" title="Mode nuit" aria-label="Mode nuit"><svg class="i-moon" viewBox="0 0 24 24"><path d="M19.6 14.9c-1.2.6-2.5.9-3.9.8-4.3-.3-7.4-4-7.1-8.2.1-1.3.5-2.4 1.1-3.4-3.7 1-6.3 4.6-6 8.6.4 4.6 4.4 8.1 9.1 7.8 3.1-.2 5.6-2 6.8-4.6z"/><path d="M16.4 4.6l.3 1.2m-.9-.4l1.3-.2" stroke-width="1.3"/></svg><svg class="i-sun" viewBox="0 0 24 24"><path d="M12.2 7.6c2.4.1 4.3 2.1 4.2 4.5-.1 2.5-2.2 4.4-4.6 4.3-2.4-.1-4.3-2.2-4.2-4.6.1-2.3 2.1-4.3 4.6-4.2z"/><path d="M12 2.4l.2 2.4M12.1 19.3l-.1 2.3M2.5 12.2l2.3-.1M19.2 11.9l2.4.1M5.1 5.3l1.7 1.6M17.3 17.2l1.6 1.7M18.9 5.1l-1.7 1.7M6.8 17.1l-1.6 1.8"/></svg></button>
      <button class="tb-btn hand" id="btnSettings" title="Paramètres" aria-label="Paramètres"><svg viewBox="0 0 24 24"><path d="M10.4 3.1l3.1-.1.5 2.4 1.9 1 2.2-1.1 2.1 2.3-1.2 2.1.5 2.1 2.3.8-.1 3.1-2.4.5-1 1.9 1.1 2.2-2.3 2.1-2.1-1.2-2.1.6-.8 2.2-3.1-.1-.5-2.3-1.9-1-2.2 1.1-2.1-2.3 1.2-2.1-.6-2.1-2.2-.8.1-3.1 2.3-.5 1-1.9-1.1-2.2 2.3-2.1 2.1 1.2 2.1-.6z"/><path d="M12.1 9.2c1.6 0 2.9 1.4 2.8 3-.1 1.5-1.4 2.8-3 2.7-1.5-.1-2.8-1.4-2.7-3 .1-1.6 1.4-2.8 2.9-2.7z"/></svg></button>
      <button class="pill" id="btnExport"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Exporter</button>
      <button class="pill accent" id="btnClaude"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Claude</button>
    </div>
  </header>
  <div class="body">
    <nav class="sidebar" id="sidebar" aria-label="Étapes d'écriture"></nav>
    <main class="main" id="main" tabindex="-1"></main>
    <aside class="claude-panel" id="claudePanel" aria-label="Assistant Claude" hidden></aside>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root" aria-live="polite"></div>
<input type="file" id="fileInput" accept=".truby,.json,application/json" hidden>
<script src="config.js?v=20261007080405"></script>
<script src="gate.js?v=20261007080405"></script>
<script src="data.js?v=20261007080405"></script>
<script src="app.js?v=20261007080405"></script>
<script src="settings.js?v=20261007080405"></script>
<script src="cloud.js?v=20261007080405"></script>
<script src="editor.js?v=20261007080405"></script>
<script src="sample.js?v=20261007080405"></script>
<script src="exporter.js?v=20261007080405"></script>
<script src="claude.js?v=20261007080405"></script>
<script>Gate.run().then(() => App.start());</script>
</body>
</html>
